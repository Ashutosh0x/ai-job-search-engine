name: CI

on:
  push: { branches: [master, main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci

      # Was a ratchet at 51 while errors were pre-existing. They are gone: the
      # 13 in app code are fixed and the 29 in the vendored
      # countries-states-cities-database are excluded in tsconfig, which is the
      # honest way to not own someone else's seed script. So this is a GATE now
      # -- a ratchet that never tightens just legitimises the number it holds.
      #
      # next.config.mjs no longer sets ignoreBuildErrors either, so `next build`
      # enforces the same thing. This step exists to fail the PR before a
      # reviewer spends time on it.
      - name: Typecheck
        run: npx tsc --noEmit

      # The suites make live HTTP calls to ATS boards; a blocked runner should
      # not fail the build, so those assertions are skipped in CI.
      - name: Tests
        run: npm test

      # The build is the only thing that exercises the App Router, server
      # components and the route manifest together. Typecheck and unit tests
      # both pass on a tree that fails to build.
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
