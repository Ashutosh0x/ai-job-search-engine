name: Refresh job index

# Tiered polling, because the platforms differ by two orders of magnitude in
# cost. Measured per-board averages from this repo's own crawl reports:
#   Greenhouse ~0.4s, Ashby ~0.7s   -> cheap, poll often
#   SmartRecruiters ~1-6s           -> moderate
#   Workday ~23-101s, Eightfold ~50s -> expensive, poll daily
#
# Polling everything on the fast cadence would be one continuous crawl against
# 1,200 employers and would still leave each board ~20 minutes stale, so it
# would cost far more and deliver less.
on:
  schedule:
    - cron: '*/15 * * * *'   # hot   — Greenhouse/Ashby/Lever/Workable
    - cron: '0 */3 * * *'    # warm  — SmartRecruiters/Recruitee/Teamtailor
    - cron: '0 4 * * *'      # cold  — Workday/Eightfold/Oracle, nightly
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to refresh'
        required: true
        default: hot
        type: choice
        options: [hot, warm, cold, all]

concurrency:
  # Never let two refreshes write the index at once: the second would merge
  # against a file the first is still writing.
  group: refresh-job-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The index is too large to keep in git, so it is restored from cache.
      # A cache miss means there is nothing to merge into, which the refresh
      # script detects and reports rather than writing a partial index.
      # public/data/jobs-deploy.json is committed, so a cache miss still leaves a
      # valid base to merge into -- the run degrades to refreshing the bounded
      # slice rather than failing outright.
      - name: Restore job index
        uses: actions/cache/restore@v4
        with:
          path: |
            public/data/jobs-v2.json
            .ingest-state.json
          key: job-index-${{ github.run_id }}
          restore-keys: job-index-

      # Always end up with public/data/jobs-v2.json, because that is the ONLY
      # path the save step persists.
      #
      # This used to refresh jobs-deploy.json on a cache miss and still save
      # jobs-v2.json -- a file that path never created. So the miss produced no
      # cache, the next run missed too, and the workflow could never bootstrap:
      # it ran every 15 minutes for two days, crawled each time, and discarded
      # the result. The cache list held no job-index entry at all.
      #
      # Seeding from the committed bounded index instead keeps the run useful on
      # a cold start AND leaves something to save, so the next run starts warm.
      - name: Ensure a base index exists
        id: base
        run: |
          if [ -f public/data/jobs-v2.json ]; then
            echo "Using restored full index ($(du -h public/data/jobs-v2.json | cut -f1))"
          else
            echo "Cache miss; seeding the full index from the committed bounded one."
            cp public/data/jobs-deploy.json public/data/jobs-v2.json
          fi
          echo "out=public/data/jobs-v2.json" >> "$GITHUB_OUTPUT"

      - name: Pick tier from schedule
        id: tier
        run: |
          case "${{ github.event.schedule }}" in
            "*/15 * * * *") echo "tier=hot"  >> "$GITHUB_OUTPUT" ;;
            "0 */3 * * *")  echo "tier=warm" >> "$GITHUB_OUTPUT" ;;
            "0 4 * * *")    echo "tier=cold" >> "$GITHUB_OUTPUT" ;;
            *)              echo "tier=${{ inputs.tier || 'hot' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      # `npx tsx`, not `node`. refresh.mjs imports .ts modules
      # (lib/pipeline/orchestrator.ts and friends), and plain node rejects them
      # with ERR_UNKNOWN_FILE_EXTENSION. Every scheduled run failed in ~30s on
      # this before it was caught.
      - name: Refresh
        # 12 GB, not 8. ubuntu-latest has 16 GB, and the scheduled runs were
        # dying at exactly the 8 GB ceiling -- "Reached heap limit Allocation
        # failed", exit 134, roughly every other run. It read as a flaky crawl;
        # it was the heap limit being hit while parsing the restored index.
        run: NODE_OPTIONS=--max-old-space-size=12288 npx tsx scripts/refresh.mjs --tier ${{ steps.tier.outputs.tier }} --out ${{ steps.base.outputs.out }}

      - name: Save job index
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/jobs-v2.json
            .ingest-state.json
          key: job-index-${{ github.run_id }}
